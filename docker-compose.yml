services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm db:docker:up to generate credentials}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm db:docker:up to generate credentials}
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm db:docker:up to generate credentials}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - flowboard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  flowboard-postgres-data:
